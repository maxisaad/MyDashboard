services:
  mydash:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mydash
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - FRONTEND_URL=http://192.168.50.205:3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
